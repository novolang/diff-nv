[package]
name        = "diff-nv"
version     = "0.1.0"
description = "Myers, patience and histogram diff over lines, words or grapheme clusters, answered as an edit script of typed operations over token indices with the byte spans kept beside them; unified and side-by-side rendering into a caller's buffer with `diff -u`'s own `@@` headers; unified-patch parsing and application with an offset, a fuzz and a reject list; and a three-way merge that answers its conflicts as values as well as markers."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet, and the tests were written against the signatures rather
# than by a consumer.
stability   = "experimental"

# `core`.  A diff is arithmetic over two strings the caller already
# holds: nothing is read, nothing is written and no clock is consulted.
# The one place output could enter, writing a rendered diff to a sink,
# is effect-polymorphic (`diffrender.unified_to<W: Write[e]>`) and is
# charged what the caller's writer costs.
#
# No device claim: the token tables, the edit script and the Myers
# trace all grow with the input.
layer       = "core"

category    = "text"

tags        = ["diff", "myers", "patience", "histogram", "patch", "merge", "unified", "similar", "difflib", "sans-io"]
repository  = "https://github.com/novolang/diff-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.13.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "An edit script over token indices, and the four things that read one"

[dependencies]
# unicode-nv, for the two granularities that are not lines.
#
# `DiffGraphemes` cuts at UAX #29's extended grapheme cluster
# boundaries, so a family emoji and a combining accent are each one
# token.  `DiffWords` cuts at UAX #29's word boundaries, so a word diff
# of Japanese or of `foo_bar-baz` splits where a reader would.  The
# algorithms work on integer ids and do not use it.
unicode-nv = "^0.1.3"
